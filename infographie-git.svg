<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>

  <text x="600" y="55" text-anchor="middle" font-size="34" font-weight="700" fill="#0f172a">Git et GitHub en un coup d'œil</text>
  <text x="600" y="88" text-anchor="middle" font-size="18" fill="#475569">Le cahier de laboratoire partagé</text>

  <rect x="30" y="120" width="760" height="400" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="50" y="152" font-size="20" font-weight="700" fill="#0369a1">💻 TON PC (ton cahier personnel)</text>

  <rect x="840" y="120" width="330" height="400" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="865" y="152" font-size="20" font-weight="700" fill="#6d28d9">☁️ INTERNET</text>

  <rect x="60" y="210" width="190" height="130" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  <text x="155" y="250" text-anchor="middle" font-size="36">📝</text>
  <text x="155" y="285" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Dossier de travail</text>
  <text x="155" y="310" text-anchor="middle" font-size="14" fill="#475569">tu modifies tes fichiers</text>

  <rect x="305" y="210" width="190" height="130" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  <text x="400" y="250" text-anchor="middle" font-size="36">🧺</text>
  <text x="400" y="285" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Préparation</text>
  <text x="400" y="310" text-anchor="middle" font-size="14" fill="#475569">tu choisis ce qui part</text>

  <rect x="550" y="210" width="190" height="130" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  <text x="645" y="250" text-anchor="middle" font-size="36">📸</text>
  <text x="645" y="285" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Dépôt local</text>
  <text x="645" y="310" text-anchor="middle" font-size="14" fill="#475569">photo datée + message</text>

  <rect x="880" y="210" width="250" height="130" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="1005" y="250" text-anchor="middle" font-size="36">🗂️</text>
  <text x="1005" y="285" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">GitHub</text>
  <text x="1005" y="310" text-anchor="middle" font-size="14" fill="#475569">le classeur commun</text>

  <line x1="250" y1="275" x2="300" y2="275" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="275" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">add</text>

  <line x1="495" y1="275" x2="545" y2="275" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="520" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">commit</text>

  <line x1="740" y1="250" x2="875" y2="250" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="808" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#ea580c">push</text>

  <line x1="875" y1="310" x2="740" y2="310" stroke="#16a34a" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="808" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">pull</text>

  <path d="M1005 345 C1005 460, 155 460, 155 345" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#arrowGreen)"/>
  <text x="580" y="447" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">git clone (une seule fois, au départ)</text>

  <text x="600" y="570" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">La routine du bon binôme</text>

  <g font-size="16" font-weight="700" fill="#ffffff">
    <rect x="60" y="595" width="200" height="90" rx="14" fill="#16a34a"/>
    <text x="160" y="625" text-anchor="middle">1. PULL</text>
    <text x="160" y="652" text-anchor="middle" font-size="13" font-weight="400">je repars de la dernière version</text>

    <rect x="280" y="595" width="200" height="90" rx="14" fill="#0284c7"/>
    <text x="380" y="625" text-anchor="middle">2. TRAVAILLER</text>
    <text x="380" y="652" text-anchor="middle" font-size="13" font-weight="400">je modifie, je teste</text>

    <rect x="500" y="595" width="200" height="90" rx="14" fill="#0369a1"/>
    <text x="600" y="625" text-anchor="middle">3. ADD + COMMIT</text>
    <text x="600" y="652" text-anchor="middle" font-size="13" font-weight="400">message clair et précis</text>

    <rect x="720" y="595" width="200" height="90" rx="14" fill="#16a34a"/>
    <text x="820" y="625" text-anchor="middle">4. PULL</text>
    <text x="820" y="652" text-anchor="middle" font-size="13" font-weight="400">au cas où quelqu'un a poussé</text>

    <rect x="940" y="595" width="200" height="90" rx="14" fill="#ea580c"/>
    <text x="1040" y="625" text-anchor="middle">5. PUSH</text>
    <text x="1040" y="652" text-anchor="middle" font-size="13" font-weight="400">je partage mon travail</text>
  </g>

  <text x="600" y="725" text-anchor="middle" font-size="16" fill="#475569">Un commit = une idée. Un message utile. Jamais de mot de passe dans un dépôt.</text>
</svg>
